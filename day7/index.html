<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="./style.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.css"
      integrity="sha512-x9WwyMYBnlXMNQ6kQ/Lyzu1NqIhLQKL5Oq6xByfXuRj7s9CskyCbLv/1IjqzJmXwFXWr0ov6jBV7Qbc0hh9nHg=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
  </head>
  <body>
    <div class="nav">
      <div class="nav-part1"></div>
      <div class="nav-part2"></div>
      <div class="nav-part3"></div>
    </div>
    <div class="hero">
      <div class="hero-part1">
        <div class="h-p1-btn-L">
          <i
            class="fa-solid fa-circle-chevron-left"
            style="color: rgb(24, 49, 83); font-size: 30px"
          ></i>
        </div>
        <div class="h-p1-info">
          <h1>
            Where Faith <br />
            Touches <span>Eternity</span>
          </h1>

          <p>
            Discover the divine beauty, rich history, and spiritual significance
            of one of India's most revered temples.
          </p>

          <div>
            <button>EXPLORE TEMPLE</button>
            <button>WATCH VIDEO</button>
          </div>
        </div>
        <div class="h-p1-btn-R">
          <i
            class="fa-solid fa-circle-chevron-right"
            style="color: rgb(24, 49, 83); font-size: 30px"
          ></i>
        </div>
      </div>
      <div class="hero-part2"></div>
    </div>

    <div class="about">
      <div class="about-part1"></div>
      <div class="about-part2"></div>
    </div>
    <div class="gallery">
      <div class="gallery-part1"></div>
      <div class="gallery-part2"></div>
      <div class="gallery-part3"></div>
    </div>

    <div class="footer">
      <div class="footer-part1"></div>
      <div class="footer-part2"></div>
      <div class="footer-part3"></div>
      <div class="footer-part4"></div>
      <div class="footer-part5"></div>
    </div>
  </body>
</html>

<!-- document type of html -->
<!doctype html>
<!-- html start tag 
attributes => additional information of a html tag / element 

lang => language of html
en => english
-->
<html lang="en">
  <!-- head start tag -->
  <head>
    <!-- meta tag => gives information about the document to the browser

  charset => encoding of the document
  utf-8 => universal character set 
  -->
    <meta charset="UTF-8" />

    <!-- viewport
  viewport => size of the device
  content => size of the device 
  -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- title => title of the document which is visible on the tab -->
    <title>Document</title>
  </head>
  <body>

    shsvdgwehcdsghdv


  </body>

  <!-- html end tag -->
</html>
